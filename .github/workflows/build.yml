name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        boot: ['4.0.0', '4.0.8', '4.1.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and install starter
        run: ./mvnw -B -ntp clean install -Dspring-boot.version=${{ matrix.boot }}
      - name: Build and test MVC example
        run: ./mvnw -B -ntp -f examples/support-triage/pom.xml clean verify -Dspring-boot.version=${{ matrix.boot }}
      - name: Verify without virtual threads
        if: matrix.java != '17'
        run: ./mvnw -B -ntp -f examples/support-triage/pom.xml test -Dspring-boot.version=${{ matrix.boot }} -Dspring.threads.virtual.enabled=false
